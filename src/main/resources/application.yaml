spring:
  application:
    name: ImageCloud
  profiles:
    active: dev
  datasource:
    url: "${imagecloud.mysql.url}"
    username: "${imagecloud.mysql.username}"
    password: "${imagecloud.mysql.password}"
  data:
    redis:
      host: "${imagecloud.redis.host}"
      port: "${imagecloud.redis.port}"
      database: "${imagecloud.redis.database}"
      password: "${imagecloud.redis.password}"

mybatis-plus:
  mapper-locations: "classpath*:/mapper/**/*.xml"
  configuration:
    #驼峰映射
    map-underscore-to-camel-case: true
    #日志打印
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    #逻辑删除
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    version: openapi_3_0
  group-configs:
    - group: default
      paths-to-match: "/**"
      packages-to-scan: com.blank.imagecloud.controller
